<svg width="1000" height="750" viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="750" fill="#f8f9fa"/>
  
  <!-- Styles -->
  <style>
    .box { fill: #ffffff; stroke: #2c3e50; stroke-width: 2; rx: 8; ry: 8; }
    .box-decision { fill: #fff3cd; stroke: #856404; stroke-width: 2; rx: 8; ry: 8; }
    .box-guardrail { fill: #f8d7da; stroke: #721c24; stroke-width: 2; rx: 8; ry: 8; }
    .box-output { fill: #d4edda; stroke: #155724; stroke-width: 2; rx: 8; ry: 8; }
    .arrow { fill: none; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
    .arrow-guardrail { fill: none; stroke: #721c24; stroke-width: 2; stroke-dasharray: 5,5; marker-end: url(#arrowhead-red); }
    .arrow-semantic { fill: none; stroke: #856404; stroke-width: 2; stroke-dasharray: 5,5; marker-end: url(#arrowhead-yellow); }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #2c3e50; text-anchor: middle; }
    .label-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #2c3e50; text-anchor: middle; font-weight: 600; }
    .label-small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #6c757d; text-anchor: middle; }
    .label-guardrail { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #721c24; text-anchor: middle; font-weight: 600; }
    .label-semantic { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #856404; text-anchor: middle; font-weight: 600; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; fill: #1a1a2e; text-anchor: middle; font-weight: 700; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #6c757d; text-anchor: middle; }
    .note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #495057; text-anchor: start; }
    .legend-box { rx: 4; ry: 4; }
  </style>
  
  <!-- Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#721c24"/>
    </marker>
    <marker id="arrowhead-yellow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#856404"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="500" y="40" class="title">ProofPilot Architecture</text>
  <text x="500" y="62" class="subtitle">Evidence-Grounded Verification Pipeline with Auditable Provenance</text>
  
  <!-- Pipeline Flow - Main Column -->
  <!-- Task -->
  <rect x="350" y="90" width="300" height="60" class="box"/>
  <text x="500" y="122" class="label-bold">Task</text>
  <text x="500" y="142" class="label-small">Question + document IDs</text>
  
  <!-- Arrow 1 -->
  <path d="M500 150 L500 170" class="arrow"/>
  
  <!-- Document Ingestion -->
  <rect x="350" y="170" width="300" height="60" class="box"/>
  <text x="500" y="202" class="label-bold">Document Ingestion</text>
  <text x="500" y="222" class="label-small">PDF extraction (pypdf) → chunking → SQLite</text>
  
  <!-- Arrow 2 -->
  <path d="M500 230 L500 250" class="arrow"/>
  
  <!-- Chunking / Indexing -->
  <rect x="350" y="250" width="300" height="60" class="box"/>
  <text x="500" y="282" class="label-bold">Chunking / Indexing</text>
  <text x="500" y="302" class="label-small">Fixed-size chunks with overlap → keyword index</text>
  
  <!-- Arrow 3 -->
  <path d="M500 310 L500 330" class="arrow"/>
  
  <!-- Evidence Retrieval -->
  <rect x="350" y="330" width="300" height="60" class="box"/>
  <text x="500" y="362" class="label-bold">Evidence Retrieval</text>
  <text x="500" y="382" class="label-small">BM25-style lexical (KeywordRetriever)</text>
  
  <!-- Arrow 4 -->
  <path d="M500 390 L500 410" class="arrow"/>
  
  <!-- Claim Generation -->
  <rect x="350" y="410" width="300" height="60" class="box"/>
  <text x="500" y="442" class="label-bold">Claim Generation</text>
  <text x="500" y="462" class="label-small">Deterministic assertion extraction</text>
  
  <!-- Arrow 5 -->
  <path d="M500 470 L500 490" class="arrow"/>
  
  <!-- Deterministic Verification -->
  <rect x="200" y="490" width="600" height="70" class="box-guardrail"/>
  <text x="500" y="518" class="label-bold" style="fill: #721c24;">⚠ Deterministic Verification (Guardrail)</text>
  <text x="500" y="538" class="label-small" style="fill: #721c24;">Lexical overlap + negation markers + commitment words</text>
  <text x="500" y="555" class="label-small" style="fill: #721c24;">Outputs: CONTRADICTED | SUPPORTED (weak/strong) | INSUFFICIENT_EVIDENCE</text>
  
  <!-- Guardrail Annotations -->
  <!-- Case A -->
  <rect x="50" y="490" width="140" height="70" class="box-guardrail"/>
  <text x="120" y="515" class="label-guardrail">Case A</text>
  <text x="120" y="532" class="label-small" style="fill: #721c24;">CONTRADICTED</text>
  <text x="120" y="548" class="label-small" style="fill: #721c24;">LLM NOT consulted</text>
  <text x="120" y="564" class="label-small" style="fill: #721c24;">Cannot override</text>
  
  <!-- Case B -->
  <rect x="810" y="490" width="140" height="70" class="box-guardrail"/>
  <text x="880" y="515" class="label-guardrail">Case B</text>
  <text x="880" y="532" class="label-small" style="fill: #721c24;">SUPPORTED</text>
  <text x="880" y="548" class="label-small" style="fill: #721c24;">Overlap ≥ 1.0</text>
  <text x="880" y="564" class="label-small" style="fill: #721c24;">LLM NOT consulted</text>
  
  <!-- Arrow from Deterministic to Semantic (conditional) -->
  <path d="M500 560 L500 590" class="arrow-semantic"/>
  <text x="510" y="575" class="label-semantic">If weak support (overlap < 1.0)</text>
  <text x="510" y="587" class="label-semantic">or INSUFFICIENT_EVIDENCE</text>
  
  <!-- Hybrid Semantic Verification -->
  <rect x="350" y="590" width="300" height="70" class="box-decision"/>
  <text x="500" y="618" class="label-bold" style="fill: #856404;">Hybrid Semantic Verification</text>
  <text x="500" y="638" class="label-small" style="fill: #856404;">LLMProvider (Ollama, OpenAI, FakeLLM)</text>
  <text x="500" y="655" class="label-small" style="fill: #856404;">Respects LLM verdict: SUPPORTED | CONTRADICTED | INSUFFICIENT</text>
  
  <!-- LLM fallback note -->
  <rect x="50" y="590" width="280" height="70" class="box-decision"/>
  <text x="190" y="615" class="label-semantic">LLM Failure Fallback</text>
  <text x="190" y="632" class="label-small" style="fill: #856404;">Network error / malformed output /</text>
  <text x="190" y="647" class="label-small" style="fill: #856404;">invalid status → Deterministic result</text>
  
  <!-- Arrow 7 -->
  <path d="M500 660 L500 680" class="arrow"/>
  
  <!-- Evidence Graph -->
  <rect x="350" y="680" width="300" height="50" class="box-output"/>
  <text x="500" y="707" class="label-bold" style="fill: #155724;">Evidence Graph</text>
  
  <!-- Arrow 8 -->
  <path d="M500 730 L500 750" class="arrow"/>
  
  <!-- Provenance -->
  <rect x="350" y="750" width="300" height="50" class="box-output"/>
  <text x="500" y="777" class="label-bold" style="fill: #155724;">Provenance (SQLite)</text>
  
  <!-- Arrow 9 -->
  <path d="M500 800 L500 820" class="arrow"/>
  
  <!-- Audit Report -->
  <rect x="350" y="820" width="300" height="50" class="box-output"/>
  <text x="500" y="847" class="label-bold" style="fill: #155724;">Audit Report (JSON + Markdown)</text>
  
  <!-- Legend -->
  <g transform="translate(50, 880)">
    <rect x="0" y="0" width="900" height="50" class="box" style="fill: #f8f9fa; stroke: #dee2e6;"/>
    <text x="10" y="20" class="label-bold" style="text-anchor: start; fill: #2c3e50;">Legend:</text>
    
    <rect x="80" y="8" width="18" height="18" class="legend-box" style="fill: #ffffff; stroke: #2c3e50;"/>
    <text x="105" y="20" class="label-small" style="text-anchor: start;">Standard pipeline step</text>
    
    <rect x="260" y="8" width="18" height="18" class="legend-box" style="fill: #f8d7da; stroke: #721c24;"/>
    <text x="285" y="20" class="label-small" style="text-anchor: start;">Deterministic guardrail (Cases A, B)</text>
    
    <rect x="530" y="8" width="18" height="18" class="legend-box" style="fill: #fff3cd; stroke: #856404;"/>
    <text x="555" y="20" class="label-small" style="text-anchor: start;">Semantic verification (Cases C, D)</text>
    
    <rect x="800" y="8" width="18" height="18" class="legend-box" style="fill: #d4edda; stroke: #155724;"/>
    <text x="825" y="20" class="label-small" style="text-anchor: start;">Final outputs</text>
  </g>
  
  <!-- Key Guardrail Note -->
  <g transform="translate(50, 940)">
    <rect x="0" y="0" width="900" height="60" class="box" style="fill: #fff3cd; stroke: #856404;"/>
    <text x="450" y="22" class="label-bold" style="fill: #856404; text-anchor: middle;">KEY GUARDRAIL RULES</text>
    <text x="450" y="42" class="label-small" style="fill: #856404; text-anchor: middle;">• Deterministic CONTRADICTED (Case A) → LLM never consulted, result is final</text>
    <text x="450" y="56" class="label-small" style="fill: #856404; text-anchor: middle;">• Deterministic SUPPORTED with overlap ≥ 1.0 (Case B) → LLM never consulted, result is final</text>
  </g>
</svg>